<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>SweetManager - Punto de venta</title>

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
        <link
            href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap"
            rel="stylesheet"/>
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="css/puente-bootstrap.css" />
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/layout.css" />
        <link rel="stylesheet" href="css/pos.css" />
        <link rel="stylesheet" href="css/componentes.css" />
        <link rel="stylesheet" href="css/dashboard.css" />
        <link rel="stylesheet" href="css/pedidos.css" />
        <link rel="stylesheet" href="css/animaciones.css" />
        <link rel="stylesheet" href="css/menu.css" />
        <link rel="stylesheet" href="css/login.css" />
        <link rel="stylesheet" href="css/perfil.css" />
        <link rel="stylesheet" href="css/responsive.css" />
    </head>

    <body>
        <div class="login" id="login">
            <span class="deco" style="top: 6%; left: 8%">*</span>
            <span class="deco" style="top: 30%; left: 3%">•</span>
            <span class="deco" style="bottom: 8%; left: 6%">.</span>
            <span class="deco" style="top: 8%; right: 7%">*</span>
            <span class="deco" style="bottom: 10%; right: 6%">•</span>

            <div class="login-card row g-0">
                <div class="login-brand col-md-6">
                    <img src="imagenes/logo.png" alt="SweetManager" />
                    <h1>Sweet<b>Manager</b></h1>
                    <p>Sistema integral para dulcerías</p>
                </div>

                <form class="login-form col-md-6" id="lform" autocomplete="on">
                    <h2>Iniciar sesión</h2>
                    <p>Ingresa tus credenciales para acceder a tu cuenta</p>

                    <label for="lu">Usuario</label>
                    <div class="field">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="8" r="4" />
                            <path da="M4 21c0-4 4-7 8-7s8 3 8 7" />
                        </svg>
                        <input
                            id="lu"
                            type="text"
                            placeholder="Ingresa tu usuario"
                            autocomplete="username"

                        />
                    </div>

                    <label for="lp">Contraseña</label>
                    <div class="field">
                        <svg viewBox="0 0 24 24">
                            <rect x="5" y="11" width="14" height="10" rx="2" />
                            <path d="M8 11V8a4 4 0 0 1 8 0v3" />
                        </svg>
                        <!--Atributos para el espacio de la contraseña-->
                        <input 
                            id="lp"
                            type="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                        />
                        <button
                            type="button"
                            class="eye"
                            data-act="ojo"
                            aria-label="Mostrar u ocultar contraseña"
                        >
                            <svg viewBox="0 0 24 24">
                                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>

                    <p class="lerr" id="lerr"></p><!--Para indicar si hay errores con las credenciales-->
                    <!--NOTA IMPORTANTE: mejorar para que sea mas especifico como tambien mostrar mensaje para comunicarse con el encargado o con nosotros si hay algun error etc.-->
                    <button class="lbtn" type="submit">Iniciar sesión</button>
                </form>
            </div>
        </div>

        <div class="app">
            <aside>
                <div class="logo">
                    <img src="imagenes/logo.png" alt="SweetManager" class="logo-img" />
                    <span class="brand">Sweet<b>Manager</b></span>
                    <small>Sistema integral para dulcerías</small>
                </div>

                <nav class="menu">
                    <button class="menu-btn on" data-v="dashboard">
                        <span>Dashboard</span>
                    </button>
                    <button class="menu-btn" data-v="venta">
                        <span>Punto de venta</span>
                    </button>
                    <button class="menu-btn" data-v="pedidos">
                        <span>Pedidos</span>
                        <span class="b p" id="np"></span>
                    </button>
                    <button class="menu-btn" data-v="ventas">

                        <span>Ventas del día</span>
                    </button>
                    <button class="menu-btn" data-v="facturas">
                        <span>Facturación</span>
                    </button>
                    <button class="menu-btn" data-v="proveedores">
                        <span>Proveedores</span>
                    </button>
                </nav>

                <div class="stripe">
                    <i style="background: var(--sweet-pink)"></i>
                    <i style="background: var(--sweet-yellow)"></i>
                    <i style="background: var(--sweet-cyan)"></i>
                </div>
            </aside>

            <main>
                <div class="top">
                    <h2 id="ttl"></h2>

                    <div class="top-r">
                        <span class="who" id="who"></span>

                        <button class="btn" id="btncaja" data-act="caja" hidden></button>

                        <button
                            class="btn tema"
                            id="tema"
                            data-act="tema"
                            title="Cambiar tema"
                            aria-label="Cambiar tema"
                        >
                            <span class="material-symbols-rounded" id="temaic">dark_mode</span>
                        </button>

                        <div class="cuenta">
                            <button
                                class="chip-user"
                                id="chipuser"
                                data-act="cuenta"
                                aria-haspopup="true"
                                aria-expanded="false"
                                title="Mi cuenta"
                            >
                                <img id="uimg" alt="" />
                                <span>
                                    <b id="unom"></b>
                                    <small id="urol"></small>
                                </span>
                                <span class="material-symbols-rounded flecha">expand_more</span>
                            </button>

                            <div class="menu-user" id="menuuser" hidden>
                                <div class="mu-cab">
                                    <img id="uimg2" alt="" />
                                    <div>
                                        <b id="unom2"></b>
                                        <small id="ucor"></small>
                                    </div>
                                </div>

                                <button data-act="perfil">
                                    <span class="material-symbols-rounded">person</span>
                                    Mi perfil
                                </button>
                                <button data-act="contacto">
                                    <span class="material-symbols-rounded">support_agent</span>
                                    Contacto y soporte
                                </button>

                                <hr />

                                <button class="rojo" data-act="salir">
                                    <span class="material-symbols-rounded">logout</span>
                                    Cerrar sesión
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="view"></div>
            </main>
        </div>

        <dialog id="dlg">
            <h3 id="dt"></h3>

            <div id="db"></div>

            <div class="d-flex justify-content-end gap-2 mt-3">
                <button
                    class="btn"
                    id="dcx"
                    style="background: var(--muted)"
                    onclick="dlg.close()"
                >
                    Cerrar
                </button>

                <button class="btn pk" id="dok">Aceptar</button>
            </div>
        </dialog>

        <div class="aviso" id="toast" popover="manual"></div>

        <script src="../backend/datos.js"></script>
        <script src="js/estado.js"></script>
        <script src="../backend/cuentas.js"></script>
        <script src="../backend/bd.js"></script>
        <script src="js/app.js"></script>
        <script src="js/dashboard.js"></script>
        <script src="js/caja.js"></script>
        <script src="js/pedidos.js"></script>
        <script src="js/perfil.js"></script>
        <script src="js/proveedores.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
